<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise AI Knowledge Worker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C;
    --surface: #1B1F26;
    --surface-raised: #232832;
    --border: #2B313C;
    --text: #ECE9E3;
    --text-muted: #8B93A3;
    --accent: #D98E3F;
    --accent-soft: rgba(217, 142, 63, 0.14);
    --user-bubble: #35506B;
    --status-ok: #7FAE8C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--status-ok);
    box-shadow: 0 0 0 3px rgba(127, 174, 140, 0.15);
  }

  .status-dot.offline { background: #C97A6B; box-shadow: 0 0 0 3px rgba(201, 122, 107, 0.15); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--text); }
  .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  select.ghost-btn {
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  .upload-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .access-select {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .docs-panel {
    max-height: 0;
    overflow: hidden;
    background: var(--surface);
    border-bottom: 1px solid transparent;
    transition: max-height 0.2s ease;
  }
  .docs-panel.open { max-height: 320px; border-bottom: 1px solid var(--border); overflow-y: auto; }

  .docs-panel-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 24px 20px;
  }

  .docs-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 10px;
  }

  .upload-btn {
    background: var(--accent-soft);
    border: 1px solid rgba(217, 142, 63, 0.35);
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .upload-btn:hover { background: rgba(217, 142, 63, 0.22); }

  .upload-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text-muted);
    min-height: 16px;
    margin-bottom: 8px;
  }
  .upload-status.error { color: #D98E7B; }
  .upload-status.success { color: var(--status-ok); }

  .docs-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .docs-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 13px;
  }

  .docs-list .chunk-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .docs-empty {
    color: var(--text-muted);
    font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0 12px;
  }

  .thread {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .turn { display: flex; flex-direction: column; gap: 6px; }
  .turn.user { align-items: flex-end; }
  .turn.assistant { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .turn.user .bubble {
    background: var(--user-bubble);
    color: #F1F4F7;
    border-bottom-right-radius: 3px;
  }

  .turn.assistant .bubble {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  /* --- Signature element: the action trace --- */
  .trace {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 2px;
  }

  .trace-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(217, 142, 63, 0.3);
    border-radius: 6px;
    padding: 5px 10px;
    width: fit-content;
  }

  .trace-item .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .thinking {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .thinking .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 24px 20px;
  }

  .composer {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    max-height: 140px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  button#send {
    background: var(--accent);
    color: #16130E;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  button#send:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty-state {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .empty-state .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">Enterprise AI Knowledge Worker</span>
    <span class="brand-sub">v0.9 &middot; internal</span>
  </div>
  <div class="header-right">
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">connecting...</span>
    </div>
    <select id="roleSelect" class="ghost-btn role-select" title="Your role (controls which documents you can see)">
      <option value="employee">Role: Employee</option>
      <option value="hr">Role: HR</option>
      <option value="admin">Role: Admin</option>
    </select>
    <button class="ghost-btn" id="docsToggle" title="Manage documents">Documents</button>
    <button class="ghost-btn" id="newChatBtn" title="Start a new conversation">New chat</button>
  </div>
</header>

<div class="docs-panel" id="docsPanel">
  <div class="docs-panel-inner">
    <div class="docs-panel-header">
      <span>Knowledge base</span>
      <div class="upload-controls">
        <select id="accessLevelSelect" class="access-select" title="Who can see this document">
          <option value="public">Public (everyone)</option>
          <option value="hr">HR only</option>
          <option value="engineering">Engineering only</option>
        </select>
        <label class="upload-btn" for="fileInput">
          + Add document
          <input type="file" id="fileInput" accept=".pdf,.docx,.txt" hidden>
        </label>
      </div>
    </div>
    <div id="uploadStatus" class="upload-status"></div>
    <ul id="docsList" class="docs-list"></ul>
  </div>
</div>

<main>
  <div class="thread" id="thread">
    <div class="empty-state" id="emptyState">
      <div class="eyebrow">READY</div>
      Ask a question about the documents, request an action, or both at once.
      Every real action this assistant takes will show up as a trace above its reply.
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask something, or request an action..."></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
  // The backend now serves this exact file (see backend/api/main.py's
  // StaticFiles mount), so the API always lives at the SAME origin this
  // page was loaded from. An empty string means every fetch below (e.g.
  // `${API_BASE}/chat`) resolves to a same-origin relative path
  // ("/chat") automatically -- no separate URL to track, no cross-origin
  // request, no browser security block on reaching localhost/a tunnel.
  const API_BASE = "";

  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const roleSelect = document.getElementById("roleSelect");

  // Persist the session across page reloads so conversation memory survives a refresh.
  let sessionId = localStorage.getItem("eakw_session_id");
  let currentRole = localStorage.getItem("eakw_role") || "employee";
  roleSelect.value = currentRole;

  // --- API key handling ---
  // This is a simple internal-tool pattern: ask once, remember it locally.
  // A real production system would use a proper login flow instead of a
  // browser prompt, but the SERVER-SIDE enforcement (the actual security
  // boundary) is identical either way.
  function getApiKey() {
    let key = localStorage.getItem("eakw_api_key");
    if (!key) {
      key = window.prompt("Enter the API access key (see your .env's API_ACCESS_KEY):");
      if (key) localStorage.setItem("eakw_api_key", key);
    }
    return key || "";
  }

  function authHeaders(extra = {}) {
    return { "X-API-Key": getApiKey(), ...extra };
  }

  roleSelect.addEventListener("change", () => {
    currentRole = roleSelect.value;
    localStorage.setItem("eakw_role", currentRole);
    // The backend binds a role to a session permanently at creation --
    // switching roles mid-conversation would silently keep the OLD
    // access level, which is confusing. Force a clean new session instead.
    newChatBtn.click();
  });

  function toolLabel(toolName) {
    const labels = {
      search_knowledge_base: "Searched knowledge base",
      send_email: "Sent email",
      create_ticket: "Created ticket",
      schedule_meeting: "Scheduled meeting",
      list_recent_actions: "Looked up recent actions",
    };
    return labels[toolName] || toolName;
  }

  function argSummary(args) {
    const vals = Object.values(args || {});
    if (!vals.length) return "";
    const first = String(vals[0]);
    return first.length > 50 ? first.slice(0, 50) + "…" : first;
  }

  function addTurn(role, text, actions = []) {
    emptyState.style.display = "none";
    const turn = document.createElement("div");
    turn.className = `turn ${role}`;

    if (role === "assistant" && actions.length) {
      const trace = document.createElement("div");
      trace.className = "trace";
      actions.forEach(a => {
        const item = document.createElement("div");
        item.className = "trace-item";
        const summary = argSummary(a.arguments);
        item.innerHTML = `<span class="dot"></span>${toolLabel(a.tool)}${summary ? " — " + summary : ""}`;
        trace.appendChild(item);
      });
      turn.appendChild(trace);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    turn.appendChild(bubble);

    thread.appendChild(turn);
    thread.scrollTop = thread.scrollHeight;
    return turn;
  }

  function addThinking() {
    const turn = document.createElement("div");
    turn.className = "turn assistant";
    turn.id = "thinkingTurn";
    turn.innerHTML = `<div class="thinking"><span class="pulse"></span>thinking...</div>`;
    thread.appendChild(turn);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById("thinkingTurn");
    if (el) el.remove();
  }

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      const data = await res.json();
      statusDot.classList.remove("offline");
      statusText.textContent = `${data.document_chunks_loaded} chunks loaded`;
    } catch (e) {
      statusDot.classList.add("offline");
      statusText.textContent = "backend unreachable";
    }
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addTurn("user", message);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    addThinking();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ message, session_id: sessionId, role: currentRole }),
      });

      if (res.status === 401) {
        localStorage.removeItem("eakw_api_key");
        removeThinking();
        addTurn("assistant", "That API key was rejected. Refresh the page and enter the correct key.");
        return;
      }

      const data = await res.json();

      sessionId = data.session_id;
      localStorage.setItem("eakw_session_id", sessionId);

      removeThinking();
      addTurn("assistant", data.response, data.actions_taken || []);
    } catch (e) {
      removeThinking();
      addTurn("assistant", "Couldn't reach the backend. Is it running? (uvicorn backend.api.main:app --reload)");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  const docsToggle = document.getElementById("docsToggle");
  const docsPanel = document.getElementById("docsPanel");
  const docsList = document.getElementById("docsList");
  const fileInput = document.getElementById("fileInput");
  const uploadStatus = document.getElementById("uploadStatus");
  const newChatBtn = document.getElementById("newChatBtn");

  docsToggle.addEventListener("click", () => {
    docsPanel.classList.toggle("open");
    if (docsPanel.classList.contains("open")) loadDocuments();
  });

  async function loadDocuments() {
    try {
      const res = await fetch(`${API_BASE}/documents`, { headers: authHeaders() });
      const data = await res.json();
      renderDocuments(data.documents || []);
    } catch (e) {
      docsList.innerHTML = `<li class="docs-empty">Couldn't load document list.</li>`;
    }
  }

  function renderDocuments(docs) {
    if (!docs.length) {
      docsList.innerHTML = `<li class="docs-empty">No documents in the knowledge base yet.</li>`;
      return;
    }
    docsList.innerHTML = docs
      .map(d => `<li><span>${d.filename} <span class="chunk-count">[${d.access_level}]</span></span><span class="chunk-count">${d.chunks} chunks</span></li>`)
      .join("");
  }

  const accessLevelSelect = document.getElementById("accessLevelSelect");

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const accessLevel = accessLevelSelect.value;

    uploadStatus.className = "upload-status";
    uploadStatus.textContent = `Uploading ${file.name} (${accessLevel})...`;

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch(`${API_BASE}/documents/upload?access_level=${encodeURIComponent(accessLevel)}`, {
        method: "POST",
        headers: authHeaders(),
        body: formData,
      });
      const data = await res.json();

      if (!res.ok) {
        uploadStatus.className = "upload-status error";
        uploadStatus.textContent = data.detail || "Upload failed.";
        return;
      }

      uploadStatus.className = "upload-status success";
      uploadStatus.textContent = `Added ${data.filename} [${data.access_level}] — ${data.chunks_added} chunks (${data.total_chunks} total).`;
      statusText.textContent = `${data.total_chunks} chunks loaded`;
      loadDocuments();
    } catch (e) {
      uploadStatus.className = "upload-status error";
      uploadStatus.textContent = "Couldn't reach the backend to upload.";
    } finally {
      fileInput.value = "";
    }
  });

  newChatBtn.addEventListener("click", async () => {
    if (sessionId) {
      try {
        await fetch(`${API_BASE}/chat/session/${sessionId}`, { method: "DELETE", headers: authHeaders() });
      } catch (e) { /* server-side cleanup is best-effort; clearing locally still proceeds */ }
    }
    localStorage.removeItem("eakw_session_id");
    sessionId = null;
    thread.innerHTML = "";
    thread.appendChild(emptyState);
    emptyState.style.display = "block";
  });

  checkHealth();
  loadDocuments();
</script>

</body>
</html>
